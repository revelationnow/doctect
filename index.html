    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* App handles scrolling */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8; 
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse-soft {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.05); }
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
        opacity: 0; /* Start hidden */
      }
      .animate-fade-in {
        animation: fadeIn 1s ease-out forwards;
        opacity: 0;
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      .animate-pulse-slow {
        animation: pulse-soft 4s ease-in-out infinite;
      }
      
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-500 { animation-delay: 500ms; }
      .delay-700 { animation-delay: 700ms; }

      /* touch-editor:start */
      /* Narrow-layout and touch rules. FormFactorProvider sets data-form-factor="phone" | "tablet"
         on <html> for the narrow layouts (touch devices and narrow mouse windows alike) and
         data-input="touch" for a coarse pointer; both are absent on desktop / unmount. Rules about
         fingers (target sizes, hover reveals, colour inputs) use data-input; rules about the
         narrow layouts (full-screen dialogs, top bar, pill, shell height) use data-form-factor. */
      [data-input="touch"] button,
      [data-input="touch"] [role="button"],
      [data-input="touch"] select {
        min-height: 44px;
        min-width: 44px;
      }
      [data-input="touch"] input,
      [data-input="touch"] select,
      [data-input="touch"] textarea {
        font-size: 16px;
      }
      [data-input="touch"] .opacity-0[class~="group-hover:opacity-100"]:not(.pointer-events-none) {
        opacity: 1;
      }
      [data-input="touch"] .hidden[class~="group-hover:flex"] {
        display: flex;
      }
      [data-form-factor="phone"] :has(> .editor-dialog-panel),
      [data-form-factor] :has(> .editor-dialog-panel.generator-dialog-panel) {
        padding: 0;
      }
      [data-form-factor="phone"] .editor-dialog-panel,
      [data-form-factor] .editor-dialog-panel.generator-dialog-panel {
        width: 100vw;
        max-width: none;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
      }
      /* Tablet keeps the page header, which is a root-level z-20 above the project pane (z-10),
         so nothing inside the pane, dialogs included, can paint over it. The full-screen generator
         therefore fills the pane (its nearest positioned ancestor) below the header instead of the
         viewport; otherwise its title row, Close included, would sit under the header's controls. */
      [data-form-factor="tablet"] :has(> .editor-dialog-panel.generator-dialog-panel) {
        position: absolute;
      }
      [data-form-factor="tablet"] .editor-dialog-panel.generator-dialog-panel {
        width: 100%;
        height: 100%;
      }
      /* Phone top bar: the save status keeps its icon and tint but drops its label, which at
         320-360px otherwise leaves the project name beside it no room at all. The label stays in
         the accessibility tree (role=status / role=alert read it as before). The failure popover
         spans the bar's width just below it: anchored to the pill as on desktop it would run off
         an edge, since the pill sits mid-bar here rather than at the header's right end. */
      [data-form-factor="phone"] [data-touch-chrome="top-bar"] [role="status"],
      [data-form-factor="phone"] [data-touch-chrome="top-bar"] [role="alert"] > div:first-child {
        font-size: 0;
        gap: 0;
      }
      [data-form-factor="phone"] [data-touch-chrome="top-bar"] [role="alert"] > div:last-child {
        position: fixed;
        top: 3rem;
        left: 1rem;
        right: 1rem;
        width: auto;
      }
      /* Phone canvas: scroll room under the page equal to the floating tool pill plus its gap
         (--touch-pill-inset, measured by the phone layout), so the page bottom can be scrolled
         clear of the pill instead of ending beneath it. Only the page's content wrapper carries
         data-canvas-content: the long-press select-under menu is the scroll container's other
         child and keeps its own padding. */
      [data-form-factor="phone"] [data-canvas-content] {
        padding-bottom: calc(1rem + var(--touch-pill-inset, 0px));
      }
      /* Layer colour swatches: at 44px each the strip is wider than the space right of the chip,
         so the sheet or panel edge would clip it as an absolute popover. On touch input it becomes a
         third line of the row (chip and strip join the row's flex items; the strip takes the full
         width after the order-2 actions), so nothing can clip it and nothing is covered. */
      [data-input="touch"] [data-color-popover] {
        display: contents;
      }
      [data-input="touch"] [data-color-popover] > button {
        order: 2;
      }
      [data-input="touch"] [data-color-popover] > span {
        position: static;
        order: 3;
        flex-basis: 100%;
        margin-top: 8px;
      }
      /* Phone tool pill: its one row of tools swipes sideways on narrow screens (R43), so the row
         scrolls without a visible scrollbar and each 44px tool snaps to the row's start edge. */
      [data-form-factor="phone"] [data-touch-pill-scroller] {
        scrollbar-width: none;
        scroll-snap-type: x proximity;
      }
      [data-form-factor="phone"] [data-touch-pill-scroller]::-webkit-scrollbar {
        display: none;
      }
      [data-form-factor="phone"] [data-touch-pill-scroller] button {
        scroll-snap-align: start;
      }
      /* Touch editor shell: the visible viewport, not 100vh. Mobile browsers size 100vh as if their
         address bar were hidden, so on a first load (bar showing) the bottom of the editor, the
         phone's properties sheet included, sat below the screen until something scrolled the bar
         away. dvh tracks the bar. Desktop keeps h-screen. */
      [data-form-factor] [data-editor-shell] {
        height: 100dvh;
      }
      /* Colour inputs: TouchColorPickerHost opens the in-app picker for a tap on (or within 44px of)
         one. The inputs themselves take no pointer events, so no engine can open its own picker
         from a tap: Firefox for Android does not reliably honour a cancelled click. */
      [data-input="touch"] input[type="color"] {
        pointer-events: none;
      }
      /* touch-editor:end */
    </style>
