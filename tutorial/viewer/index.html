<!doctype html>
<!-- A plain PDF reader for the tutorial videos: shows an exported file and
     follows its internal links (pdf.js). Served by the recorder under
     /__tutorial/viewer/?file=<name> — never part of the app itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Reader</title>
<link rel="stylesheet" href="/__tutorial/pdfjs/pdf_viewer.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; background: #3a3d42; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    #bar { position: absolute; top: 0; left: 0; right: 0; height: 48px; background: #26282c; color: #e8eaed; display: flex;
        align-items: center; gap: 18px; padding: 0 18px; box-shadow: 0 1px 4px rgba(0,0,0,.4); z-index: 5; font-size: 14px; }
    #bar .name { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bar .pages { color: #bdc1c6; font-variant-numeric: tabular-nums; }
    #bar .pages b { color: #fff; font-weight: 600; }
    #bar .zoom { color: #bdc1c6; padding: 4px 10px; border-radius: 6px; background: #3c4043; }
    #viewerContainer { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; overflow: auto; }
    .pdfViewer .page { margin: 14px auto; border: none; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
    .annotationLayer .linkAnnotation > a:hover { background: rgba(255, 213, 0, .22); box-shadow: none; }
</style>
</head>
<body>
<div id="bar"><span class="name" id="name"></span><span class="pages">Page <b id="cur">1</b> of <span id="total">–</span></span><span class="zoom" id="zoom">Fit</span></div>
<div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>
<script type="module" src="/__tutorial/viewer/viewer.js"></script>
</body>
</html>
