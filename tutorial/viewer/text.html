<!doctype html>
<!-- A plain file viewer for the tutorial videos: shows a downloaded text file or image full
     screen, under the same bar as the PDF reader. Served by the recorder under
     /__tutorial/viewer/text.html?file=<name>&title=<title> — never part of the app itself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>File</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    html, body { margin: 0; height: 100%; background: #3a3d42; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    #bar { position: absolute; top: 0; left: 0; right: 0; height: 48px; background: #26282c; color: #e8eaed; display: flex;
        align-items: center; gap: 18px; padding: 0 18px; box-shadow: 0 1px 4px rgba(0,0,0,.4); z-index: 5; font-size: 14px; }
    #bar .name { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bar .meta { color: #bdc1c6; font-variant-numeric: tabular-nums; }
    #doc { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; overflow: auto; }
    pre { margin: 18px auto; max-width: 920px; background: #fff; color: #1f2937; padding: 28px 34px; box-shadow: 0 2px 10px rgba(0,0,0,.45);
        font: 15px/1.6 ui-monospace, 'DejaVu Sans Mono', monospace; white-space: pre-wrap; word-break: break-word; }
    img { display: block; margin: 18px auto; max-width: calc(100% - 36px); max-height: calc(100% - 36px); background: #fff;
        box-shadow: 0 2px 10px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div id="bar"><span class="name" id="name"></span><span class="meta" id="meta"></span></div>
<div id="doc"></div>
<script>
    const query = new URLSearchParams(location.search);
    const file = query.get('file');
    document.getElementById('name').textContent = query.get('title') || file;
    const src = '/__tutorial/files/' + encodeURIComponent(file);
    const doc = document.getElementById('doc');
    window.__viewer = { state: { ready: false } };
    if (/\.(png|jpe?g|webp|svg)$/i.test(file)) {
        const img = new Image();
        img.onload = () => {
            document.getElementById('meta').textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
            window.__viewer.state.ready = true;
        };
        img.src = src;
        doc.appendChild(img);
    } else {
        fetch(src).then(r => r.text()).then(text => {
            const pre = document.createElement('pre');
            pre.textContent = text;
            doc.appendChild(pre);
            window.__viewer.state.ready = true;
        });
    }
</script>
</body>
</html>
